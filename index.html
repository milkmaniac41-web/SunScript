<!DOCTYPE html>
<html>
<head>
<title>Dialogue Script Recorder</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
margin: 0;
font-family: "Courier New", monospace;
background: #f2f2f2;
color: #111;
}

header {
background: #111;
color: white;
padding: 15px;
text-align: center;
}

#app {
max-width: 900px;
margin: auto;
padding: 15px;
}

#characterBar {
display: flex;
gap: 10px;
overflow-x: auto;
padding: 10px 0;
margin-bottom: 10px;
}

.character {
background: white;
border: 2px solid #ccc;
border-radius: 10px;
padding: 8px;
min-width: 100px;
text-align: center;
cursor: pointer;
}

.character.active {
border-color: red;
background: #ffecec;
}

.character img {
width: 55px;
height: 55px;
border-radius: 50%;
object-fit: cover;
background: #ddd;
display: block;
margin: auto;
}

.character input {
width: 90px;
font-size: 10px;
margin-top: 5px;
}

#plaque {
background: black;
color: white;
font-size: 22px;
font-weight: bold;
text-align: center;
padding: 15px;
border-radius: 12px;
margin: 10px 0;
}

#switchBtn {
width: 100%;
background: red;
color: white;
border: none;
border-radius: 15px;
padding: 25px;
font-size: 28px;
font-weight: bold;
cursor: pointer;
margin-bottom: 15px;
}

.controls {
display: flex;
flex-wrap: wrap;
gap: 8px;
justify-content: center;
margin-bottom: 15px;
}

button {
padding: 10px 14px;
font-size: 15px;
border-radius: 8px;
border: 1px solid #999;
cursor: pointer;
}

#script {
background: white;
min-height: 500px;
padding: 25px;
border-radius: 12px;
box-shadow: 0 0 8px rgba(0,0,0,0.2);
}

.block {
margin-bottom: 28px;
}

.name {
font-weight: bold;
text-transform: uppercase;
margin-bottom: 8px;
}

.line {
margin-left: 35px;
white-space: pre-wrap;
line-height: 1.5;
}

.narration {
font-weight: bold;
font-style: italic;
margin: 25px 0;
text-align: center;
}

.editing .line,
.editing .narration {
outline: 2px dashed #777;
padding: 5px;
}

#trash {
background: darkred;
color: white;
text-align: center;
padding: 15px;
border-radius: 10px;
margin-bottom: 15px;
font-weight: bold;
}

@media (max-width: 600px) {
header h1 {
font-size: 22px;
}

#switchBtn {
font-size: 22px;
padding: 22px;
}

#script {
padding: 18px;
}

.line {
margin-left: 15px;
}
}
</style>
</head>

<body>

<header>
<h1>Dialogue Script Recorder</h1>
</header>

<div id="app">

<div id="characterBar"></div>

<div id="trash">Drag Character Here To Remove From Rotation</div>

<div id="plaque">Current Character: JOHN</div>

<button id="switchBtn" onclick="switchCharacter()">SWITCH CHARACTER</button>

<div class="controls">
<button onclick="startRecording()">Start Recording</button>
<button onclick="stopRecording()">Stop Recording</button>
<button onclick="toggleNarration()">Narration</button>
<button onclick="toggleEdit()">Edit Script</button>
<button onclick="addCharacter()">Add Character</button>
<button onclick="clearScript()">Clear Script</button>
</div>

<div id="script"></div>

</div>

<script>
let characters = [
{ name: "John", image: "" },
{ name: "Riley", image: "" }
];

let currentCharacter = 0;
let recognition;
let isRecording = false;
let narrationMode = false;
let editMode = false;
let currentBlock = null;
let lastSpeechTime = null;
let draggedIndex = null;

const characterBar = document.getElementById("characterBar");
const plaque = document.getElementById("plaque");
const script = document.getElementById("script");
const trash = document.getElementById("trash");

function saveData() {
localStorage.setItem("characters", JSON.stringify(characters));
localStorage.setItem("script", script.innerHTML);
}

function loadData() {
const savedCharacters = localStorage.getItem("characters");
const savedScript = localStorage.getItem("script");

if (savedCharacters) {
characters = JSON.parse(savedCharacters);
}

if (savedScript) {
script.innerHTML = savedScript;
}
}

function drawCharacters() {
characterBar.innerHTML = "";

characters.forEach((character, index) => {
const card = document.createElement("div");
card.className = "character";
card.draggable = true;

if (index === currentCharacter && !narrationMode) {
card.classList.add("active");
}

card.innerHTML = `
<img src="${character.image || ""}">
<strong>${character.name}</strong>
<input type="file" accept="image/*">
`;

card.onclick = function() {
currentCharacter = index;
narrationMode = false;
currentBlock = null;
updatePlaque();
drawCharacters();
};

card.ondragstart = function() {
draggedIndex = index;
};

const input = card.querySelector("input");
input.onclick = function(event) {
event.stopPropagation();
};

input.onchange = function(event) {
const file = event.target.files[0];
if (!file) return;

const reader = new FileReader();

reader.onload = function(e) {
characters[index].image = e.target.result;
drawCharacters();
saveData();
};

reader.readAsDataURL(file);
};

characterBar.appendChild(card);
});
}

trash.ondragover = function(event) {
event.preventDefault();
};

trash.ondrop = function() {
if (draggedIndex !== null && characters.length > 1) {
characters.splice(draggedIndex, 1);

if (currentCharacter >= characters.length) {
currentCharacter = 0;
}

draggedIndex = null;
currentBlock = null;
drawCharacters();
updatePlaque();
saveData();
}
};

function updatePlaque() {
if (narrationMode) {
plaque.textContent = "Current Mode: NARRATION";
} else {
plaque.textContent =
"Current Character: " + characters[currentCharacter].name.toUpperCase();
}
}

function addCharacter() {
const name = prompt("Enter character name:");

if (name && name.trim() !== "") {
characters.push({ name: name.trim(), image: "" });
currentCharacter = characters.length - 1;
narrationMode = false;
currentBlock = null;
drawCharacters();
updatePlaque();
saveData();
}
}

function switchCharacter() {
narrationMode = false;
currentCharacter = (currentCharacter + 1) % characters.length;
currentBlock = null;
lastSpeechTime = null;
drawCharacters();
updatePlaque();
}

function toggleNarration() {
narrationMode = !narrationMode;
currentBlock = null;
lastSpeechTime = null;
drawCharacters();
updatePlaque();
}

function toggleEdit() {
editMode = !editMode;

document.querySelectorAll(".line, .narration").forEach(element => {
element.contentEditable = editMode;
});

script.classList.toggle("editing", editMode);
saveData();
}

function fixGrammar(text) {
text = text.trim();
if (!text) return "";

text = text.replace(/\bi\b/g, "I");
text = text.replace(/\s+/g, " ");

return text;
}

function capitalizeAfterPeriod(text) {
return text.replace(/(^\s*\w|[.!?]\s+\w)/g, function(match) {
return match.toUpperCase();
});
}

function addDialogue(rawText) {
let text = fixGrammar(rawText);
if (!text) return;

const now = Date.now();
let punctuation = "";

if (lastSpeechTime !== null) {
const pause = now - lastSpeechTime;

if (pause > 2000) {
punctuation = ". ";
} else {
punctuation = ", ";
}
}

lastSpeechTime = now;

if (narrationMode) {
const narration = document.createElement("div");
narration.className = "narration";
narration.contentEditable = editMode;
narration.textContent = "( *" + text + "* )";
script.appendChild(narration);
saveData();
return;
}

if (!currentBlock) {
currentBlock = document.createElement("div");
currentBlock.className = "block";

currentBlock.innerHTML = `
<div class="name">${characters[currentCharacter].name}:</div>
<div class="line" contenteditable="${editMode}"></div>
`;

script.appendChild(currentBlock);
}

const line = currentBlock.querySelector(".line");

if (line.textContent.length === 0) {
line.textContent = text;
} else {
line.textContent += punctuation + text;
}

line.textContent = capitalizeAfterPeriod(line.textContent);

if (!/[.!?]$/.test(line.textContent)) {
line.textContent += ".";
}

saveData();
}

function startRecording() {
const SpeechRecognition =
window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognition) {
alert("Use Google Chrome for voice recording.");
return;
}

recognition = new SpeechRecognition();
recognition.lang = "en-US";
recognition.continuous = true;
recognition.interimResults = false;

recognition.onresult = function(event) {
const transcript =
event.results[event.results.length - 1][0].transcript;

addDialogue(transcript);
};

recognition.onend = function() {
if (isRecording) {
recognition.start();
}
};

recognition.start();
isRecording = true;
}

function stopRecording() {
isRecording = false;

if (recognition) {
recognition.stop();
}

currentBlock = null;
lastSpeechTime = null;
}

function clearScript() {
if (confirm("Clear the whole script?")) {
script.innerHTML = "";
currentBlock = null;
localStorage.removeItem("script");
}
}

script.addEventListener("input", saveData);

loadData();
drawCharacters();
updatePlaque();
</script>

</body>
</html>
